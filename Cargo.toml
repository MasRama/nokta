[workspace]
members = ["core", "desktop/src-tauri"]
# The Windows app builds only when asked (`-p nokta-desktop`).
default-members = ["core"]
resolver = "2"

[workspace.package]
version = "0.11.1" # x-release-please-version
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/MasRama/nokta"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Sized for memory: noktad is idle nearly always, and the kernel maps most of
# its code around the pages it runs, so smaller code is a smaller RSS.
opt-level = "s"
# Without unwinding noktad loses its unwind tables and landing pads, about
# 1 MB; a panic stops it and systemd starts it again. The Windows app has no
# such keeper, so its CI builds set CARGO_PROFILE_RELEASE_PANIC=unwind.
panic = "abort"

# Covers and pictures still decode at full speed.
[profile.release.package]
image = { opt-level = 3 }
image-webp = { opt-level = 3 }
png = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
fdeflate = { opt-level = 3 }
