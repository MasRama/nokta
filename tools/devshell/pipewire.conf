# The devshell's private PipeWire: the "default" metadata a session manager
# would make, and two silent outputs for the open player's output button.
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = nokta-speakers
            node.description = "Speakers"
            device.icon_name = audio-speakers
            media.class = Audio/Sink
            audio.position = [ FL FR ]
        }
    }
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = nokta-headphones
            node.description = "Headphones"
            device.icon_name = audio-headphones
            media.class = Audio/Sink
            audio.position = [ FL FR ]
        }
    }
]
