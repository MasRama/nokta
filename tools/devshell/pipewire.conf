# The devshell's private PipeWire: the "default" metadata a session manager
# would make, two silent outputs for the open player's output button, and a
# silent microphone for calls (mic.sh).
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = nokta-speakers
            node.description = "Speakers"
            device.icon_name = audio-speakers
            media.class = Audio/Sink
            audio.channels = 2
            audio.position = [ FL FR ]
        }
    }
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = nokta-headphones
            node.description = "Headphones"
            device.icon_name = audio-headphones
            media.class = Audio/Sink
            audio.channels = 2
            audio.position = [ FL FR ]
        }
    }
    { factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = nokta-microphone
            node.description = "Microphone"
            media.class = Audio/Source/Virtual
            audio.channels = 2
            audio.position = [ FL FR ]
            # Ports a session manager would make, so mic.sh can link a call to it.
            adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
        }
    }
]
