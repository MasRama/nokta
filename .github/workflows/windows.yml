name: Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Windows app
    runs-on: windows-latest
    env:
      # The release profile aborts on a panic for noktad; the app unwinds.
      CARGO_PROFILE_RELEASE_PANIC: unwind
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      # The installer carries the nokta command; Tauri's build script wants
      # it there before anything of the app compiles. It waits in bin\, as
      # the app's Nokta.exe would overwrite it in target\release.
      - name: Build the nokta command
        shell: pwsh
        run: |
          cargo build --release --locked -p nokta-core --bin nokta
          New-Item -ItemType Directory -Force desktop/src-tauri/bin | Out-Null
          Copy-Item target/release/nokta.exe desktop/src-tauri/bin/
      - run: cargo clippy -p nokta-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p nokta-desktop --locked
      - name: Build the installer
        working-directory: desktop
        run: npx tauri build --bundles nsis
      # The smoke: install as a user would, start it, start it again (the
      # second must leave and open the settings), and shoot the desktop.
      - name: Install and start Nokta
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Nokta\Nokta.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          Start-Process $exe
          Start-Sleep -Seconds 10
          # The first start shows the tour; Skip, at the bottom left of the
          # default notch, ends it, kept in state.toml.
          ./tools/windows/shot.ps1 -Name tour
          Add-Type -AssemblyName System.Windows.Forms
          $middle = [int]([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width / 2)
          ./tools/windows/hit.ps1 -X ($middle - 175) -Y 129 -Expect nokta
          ./tools/windows/shot.ps1 -Name tour-again
          $state = "$env:APPDATA\nokta\state.toml"
          $ended = { (Test-Path $state) -and (Select-String -Path $state -Pattern 'tour-shown = true' -Quiet) }
          if (& $ended) { throw "the tour ended before anyone pressed Skip" }
          ./tools/windows/click.ps1 -X ($middle - 175) -Y 129
          Start-Sleep -Seconds 1
          if (-not (& $ended)) { throw "Skip did not end the tour ($state)" }
          ./tools/windows/shot.ps1 -Name idle
          # Clicks reach the window under Nokta's, except over the notch.
          ./tools/windows/hit.ps1 -X $middle -Y 200 -Expect other
          ./tools/windows/hit.ps1 -X $middle -Y 10 -Expect nokta
          # Resting on the notch opens home.
          Start-Sleep -Seconds 1
          ./tools/windows/shot.ps1 -Name home
          ./tools/windows/hit.ps1 -X $middle -Y 200 -Expect other
          # Another app's toast shows in the notch, read from Windows' database.
          Start-Sleep -Seconds 2
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/windows/toast.ps1
          Start-Sleep -Seconds 3
          ./tools/windows/shot.ps1 -Name notification
          Get-Content "$env:LOCALAPPDATA\nokta\nokta.log"
          # What Windows kept of it, for when the notch shows nothing.
          python -c "import os,sqlite3; db=os.path.expandvars(r'%LOCALAPPDATA%\Microsoft\Windows\Notifications\wpndatabase.db'); [print(r) for r in sqlite3.connect('file:'+db+'?mode=ro', uri=True).execute('select Id, Type, ArrivalTime from Notification order by ArrivalTime desc limit 3')]"
          # The nokta command, on the user's Path, reaches the app over its pipe.
          $userPath = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $bin = "$env:LOCALAPPDATA\Nokta\bin"
          if (($userPath -split ';') -notcontains $bin) { throw "$bin is not on the user's Path: $userPath" }
          # After the runner's own, whose python the user's Store alias would hide.
          $env:Path = $env:Path + ';' + [Environment]::ExpandEnvironmentVariables($userPath)
          $version = nokta --version
          if ($version -notmatch '^nokta \d') { throw "bin\nokta.exe is not the nokta command: $version" }
          nokta activity set ci-build --title "Building Nokta" --detail "From CI" --progress 40
          if ($LASTEXITCODE -ne 0) { throw "nokta activity set failed" }
          nokta activity set ci-build --title ""
          if ($LASTEXITCODE -eq 0) { throw "an empty title was taken" }
          # Home lists it.
          ./tools/windows/hit.ps1 -X $middle -Y 10 -Expect nokta
          Start-Sleep -Seconds 2
          ./tools/windows/shot.ps1 -Name activity
          nokta activity end ci-build
          nokta run --title "Failing" -- cmd /c exit 3
          if ($LASTEXITCODE -ne 3) { throw "nokta run gave $LASTEXITCODE, not the command's 3" }
          nokta timer 5m Tea
          nokta timer clear
          if ($LASTEXITCODE -ne 0) { throw "nokta timer clear failed" }
          ./tools/windows/hit.ps1 -X $middle -Y 200 -Expect other
          # A second start leaves, opening the running one's settings.
          Start-Process $exe
          Start-Sleep -Seconds 5
          ./tools/windows/shot.ps1 -Name settings
          $running = @(Get-Process -Name Nokta -ErrorAction SilentlyContinue).Count
          if ($running -ne 1) { throw "expected one Nokta, found $running" }
          # nokta update against a fake GitHub whose latest release is this
          # build as 99.0.0: its setup must match SHA256SUMS, close Nokta,
          # install and start it again.
          $fake = "$env:RUNNER_TEMP\fake-github"
          New-Item -ItemType Directory -Force "$fake\repos\MasRama\nokta\releases", "$fake\download" | Out-Null
          $name = 'Nokta_99.0.0_x64-setup.exe'
          Copy-Item $setup.FullName "$fake\download\$name"
          $sum = (Get-FileHash "$fake\download\$name" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$fake\download\SHA256SUMS", "$sum  $name`n")
          $api = 'http://127.0.0.1:8765'
          @{
            tag_name = 'v99.0.0'
            html_url = 'https://github.com/MasRama/nokta/releases/tag/v99.0.0'
            assets = @(
              @{ name = $name; browser_download_url = "$api/download/$name" },
              @{ name = 'SHA256SUMS'; browser_download_url = "$api/download/SHA256SUMS" }
            )
          } | ConvertTo-Json -Depth 4 | Set-Content "$fake\repos\MasRama\nokta\releases\latest"
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $fake -PassThru -NoNewWindow
          $up = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { Invoke-WebRequest "$api/repos/MasRama/nokta/releases/latest" -UseBasicParsing | Out-Null; $up = $true; break } catch {}
          }
          if (-not $up) { throw "the fake GitHub did not start (exited: $($server.HasExited))" }
          $env:NOKTA_GITHUB_API_URL = $api
          $said = nokta update --check
          if ("$said" -notmatch 'Nokta 99\.0\.0 is available') { throw "update --check said: $said" }
          $before = (Get-Process -Name Nokta).Id
          nokta update --yes
          if ($LASTEXITCODE -ne 0) { throw "nokta update failed" }
          $restarted = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            $now = @(Get-Process -Name Nokta -ErrorAction SilentlyContinue)
            if ($now.Count -eq 1 -and $now[0].Id -ne $before) { $restarted = $true; break }
          }
          Stop-Process -Id $server.Id
          if (-not $restarted) { throw "Nokta did not start again after the update" }
          Start-Sleep -Seconds 8
          ./tools/windows/shot.ps1 -Name updated
          nokta activity set ci-after --title "After the update"
          if ($LASTEXITCODE -ne 0) { throw "the updated Nokta does not answer nokta" }
          nokta activity end ci-after
      - name: Upload the shots and the installer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke
          path: |
            shots/
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
