name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    name: Release artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install gnome-extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell
      - name: Build noktad and nokta
        run: cargo build --release --locked
      - name: Pack the extension
        working-directory: extension
        run: |
          npm ci
          npm run pack
      - name: Assemble the daemon archive
        run: |
          name="noktad-$VERSION-x86_64-linux"
          mkdir -p "build/$name"
          cp target/release/noktad target/release/nokta LICENSE \
            packaging/install.sh packaging/uninstall.sh \
            packaging/nokta.service packaging/io.nokta.Nokta.service \
            build/nokta@nokta.io.shell-extension.zip \
            "build/$name/"
          tar -C build -czf "build/$name.tar.gz" "$name"
          "build/$name/noktad" --version | grep -qx "noktad $VERSION"
          "build/$name/nokta" --version | grep -qx "nokta $VERSION"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            "build/noktad-$VERSION-x86_64-linux.tar.gz" \
            build/nokta@nokta.io.shell-extension.zip
