name: GNOME versions

# Runs Nokta in a headless GNOME Shell of every supported version.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # gnome-extensions packs the translations with gettext's msgfmt.
      - name: Install gnome-extensions and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gettext
      - run: cargo build --release --locked
      - name: Pack the extension
        working-directory: extension
        run: |
          npm ci
          npm run pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nokta
          path: |
            target/release/noktad
            build/nokta@nokta.io.shell-extension.zip

  smoke:
    name: GNOME ${{ matrix.gnome }}
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gnome: "46", image: "ubuntu:24.04", family: debian }
          - { gnome: "48", image: "debian:trixie", family: debian }
          - { gnome: "49", image: "fedora:43", family: fedora }
          - { gnome: "50", image: "fedora:44", family: fedora }
          - { gnome: "51", image: "fedora:45", family: fedora }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same script tools/devshell/matrix.sh builds its images with.
      - name: Install GNOME Shell
        run: tools/devshell/deps.sh ${{ matrix.family }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nokta
      - name: Run the smoke test
        run: |
          chmod +x target/release/noktad
          tools/devshell/smoke.sh
      - name: Check the Indonesian translation
        run: tools/devshell/i18n-shots.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gnome-${{ matrix.gnome }}
          path: |
            build/shots/
            build/devshell/*.log
            build/smoke-run.log
            build/i18n-run.log
