version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # zbus 6 is a large breaking rewrite; moving to it is planned work.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The @girs typings are pinned to the GNOME 46 generation on purpose.
      - dependency-name: "@girs/*"
      # Types must match the Node version CI runs (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint has to support a new TypeScript major first.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
