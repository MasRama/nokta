[package]
name = "nokta-desktop"
description = "Nokta for Windows: the notch, with the core running in process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "nokta-desktop"
path = "src/main.rs"

[dependencies]
nokta-core = { path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The app itself is Windows only; elsewhere the binary is a stub.
[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` names `windows_core` itself.
windows-core = "0.62"

[dev-dependencies]
quick-xml = "0.42.0"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
