[package]
name = "nokta-desktop"
description = "Nokta for Windows: the notch, with the core running in process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "nokta-desktop"
path = "src/main.rs"

[dependencies]
nokta-core = { path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The same as the core's, for the clipboard's pictures.
image = { version = "0.25.10", default-features = false, features = ["png"] }
url = "2.5.8"
# Toasts' XML, and the contract test's.
quick-xml = "0.42.0"
percent-encoding = "2.3.2"
# state.toml, kept as the user may have edited it.
toml_edit = "0.25.17"

# The app itself is Windows only; elsewhere the binary is a stub.
[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
# The settings window's picture chooser.
tauri-plugin-dialog = "2.8.4"
# Windows' notification database, read only; SQLite built in.
rusqlite = { version = "0.37", features = ["bundled"] }
# The same as the core's, to hear the database change.
notify = "8.2.1"
# The same as the core's, for the calendar feeds' clock and zone.
jiff = "0.2.38"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` names `windows_core` itself.
windows-core = "0.62"


[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
