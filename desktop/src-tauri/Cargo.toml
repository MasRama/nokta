[package]
name = "nokta-desktop"
description = "Nokta for Windows: the notch, with the core running in process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "nokta-desktop"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

# The app itself is Windows only; elsewhere the binary is a stub.
[target.'cfg(windows)'.dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
