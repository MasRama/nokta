# Nokta configuration. Changes apply as soon as the file is saved.
# Delete a line to go back to its default value.

[appearance]
theme = "midnight"       # "midnight", "graphite", "glass", "aurora", "paper", or "custom" to use the colors below
height = 32              # collapsed notch height in px, slightly above the 28 px top bar
idle_width = 180         # collapsed width when nothing plays
playing_width = 260      # collapsed width while music plays
expanded_width = 420
expanded_height = 150
corner_radius = 14       # bottom corners of the notch body
ear_radius = 8           # inward curves where the notch meets the top edge
background = "#000000"   # this and the next three colors apply only with theme = "custom"
background_opacity = 1.0 # 0.0 = see-through, 1.0 = solid; text and icons stay solid
foreground = "#ffffff"
accent = "#ffffff"       # progress bar, equalizer and OSD bar when the cover color is not used
use_album_accent = true  # tint progress bar and equalizer with the cover color
animation_speed = 1.0    # 0.5 = twice as fast, 2.0 = twice as slow
osd_width = 300          # width while the notch shows volume, brightness or Caps Lock

[behavior]
open_delay_ms = 120      # hover time before the notch opens
close_delay_ms = 300     # time after the pointer leaves before it closes
move_clock = true        # move the GNOME clock to the right side of the top bar
show_lyrics = true
replace_osd = true       # show volume, brightness and other OSD in the notch instead of GNOME's popup
osd_duration_ms = 1500   # how long the notch shows the OSD after the last change
show_caps_lock = true    # show a message in the notch when Caps Lock turns on or off
show_input_source = true # show the new keyboard layout when it changes
show_num_lock = false    # show a message in the notch when Num Lock turns on or off
all_monitors = true      # a notch on every monitor; false = only on the primary monitor
device_alerts = true     # show Bluetooth audio, charger and battery alerts in the notch
alert_duration_ms = 3000 # how long a device alert stays
show_clock = true        # the time in the notch while nothing plays
clock_format = "system"  # "24h", "12h", or "system" to follow GNOME's setting
privacy_dots = true      # a green dot while the camera is on, orange while the microphone or screen is used
live_activities = true   # show builds, downloads and other activities that apps and the nokta command report
file_shelf = true        # drop files on the notch to park them, then drag them out again
screenshot_preview = true # after a screenshot, a preview with Open, Show in Files and Keep on shelf (needs [notifications] in_notch)

[lyrics]
enabled = true           # look up synced lyrics on lrclib.net (sends artist, title, album, duration)

[timer]
focus_minutes = 25       # length of a focus session, 1 to 180
break_minutes = 5        # break that follows a focus session, 0 to 60; 0 = no break
long_break_minutes = 15  # break after every few focus sessions, 1 to 60
sessions_before_long_break = 4  # focus sessions before a long break, 0 to 12; 0 = never
sound = true             # play a sound when a focus session or a break ends
quiet_notifications = true  # no notification banners while a focus session runs
shortcut = "<Super><Alt>f"  # starts focus or stops the timer; "" = no shortcut

[notifications]
in_notch = true          # show notification banners in the notch instead of GNOME's banner
duration_ms = 5000       # how long a notification stays, 1000 to 30000
show_body = true         # false shows only the app and the title

[activities]
stale_minutes = 30       # an activity with no update for this long ends, 1 to 1440

[weather]
enabled = true           # show the weather in the open notch; asks open-meteo.com for location's forecast
location = ""            # a place like "Jakarta", or coordinates like "-6.2,106.8"; empty shows no weather
units = "celsius"        # "celsius" or "fahrenheit"

[calendar]
enabled = true           # show the next event from GNOME's calendar when the notch opens
reminder_minutes = 5     # show an event this many minutes before it starts, 0 to 60; 0 = no reminder

[clipboard]
enabled = true           # keep what you copy, text and pictures, in the open notch; in memory only
max_items = 25           # entries kept besides the pinned ones, 5 to 100
