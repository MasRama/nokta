[package]
name = "nokta-core"
description = "Nokta daemon: media, lyrics and settings over D-Bus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "nokta_core"
path = "src/lib.rs"

[[bin]]
name = "noktad"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
notify = "8.2.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream", "http2"] }
rustix = { version = "1.1.6", features = ["time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
temp-env = "0.3.6"
tempfile = "3.27.0"
wiremock = "0.6.5"
