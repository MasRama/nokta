[package]
name = "nokta-core"
description = "Nokta daemon: media, lyrics, settings and device alerts over D-Bus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "nokta_core"
path = "src/lib.rs"

[[bin]]
name = "noktad"
path = "src/main.rs"

[[bin]]
name = "nokta"
path = "src/bin/nokta.rs"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "0.11.0"
notify = "8.2.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "process", "io-util"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

# D-Bus serves Nokta and reads the players and devices on Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
# `nokta alarm` reads the local time zone.
libc = "0.2.191"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["time"] }

[dev-dependencies]
quick-xml = "0.42.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"
