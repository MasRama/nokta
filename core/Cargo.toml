[package]
name = "nokta-core"
description = "Nokta daemon: media, lyrics, settings and device alerts over D-Bus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "nokta_core"
path = "src/lib.rs"

[[bin]]
name = "noktad"
path = "src/main.rs"

[[bin]]
name = "nokta"
path = "src/bin/nokta.rs"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "0.11.0"
notify = "8.2.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "process", "io-util"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

# D-Bus serves Nokta and reads the players and devices on Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
# `nokta alarm` reads the local time zone.
libc = "0.2.191"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["time"] }

# Windows' media sessions (GSMTC) give the players there, WASAPI what plays.
[target.'cfg(windows)'.dependencies]
# The WinRT collections (IIterable, IMapView), which `windows` does not re-export.
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
quick-xml = "0.42.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"
